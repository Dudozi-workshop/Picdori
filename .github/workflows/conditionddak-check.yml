name: Picdori Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: picdori-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter platform projects
        run: |
          flutter create . --project-name picdori --org com.dudozi --platforms android,ios
          rm -f test/widget_test.dart
          python3 scripts/configure_ios.py
          python3 scripts/configure_android.py
          python3 scripts/verify_platform_brand.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Android and iOS launcher icons
        run: |
          dart run flutter_launcher_icons
          python3 scripts/verify_launcher_assets.py
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and UI tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug build
        uses: actions/upload-artifact@v4
        with:
          name: picdori-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios_simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter iOS runner
        run: |
          flutter create . --project-name picdori --org com.dudozi --platforms android,ios
          rm -f test/widget_test.dart
          python3 scripts/configure_ios.py
      - name: Resolve iOS dependencies
        run: flutter pub get
      - name: Generate iOS launcher icon
        run: |
          dart run flutter_launcher_icons
      - name: Verify iOS identity and icon
        run: |
          python3 scripts/verify_ios_runner.py
      - name: Build iOS simulator app (no signing)
        run: flutter build ios --simulator --debug
